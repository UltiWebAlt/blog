name: Qodana Code Quality

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['develop']
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config .github/qodana.yaml --within-docker false
          # Run Maven on the configured JDK 21 runner instead of the linter container JDK.
          pr-mode: false
          use-caches: true
          post-pr-comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
