version: '1.0'

profile:
  name: qodana.starter

projectJDK: '21'
linter: jetbrains/qodana-jvm-community:2026.2

# Generate MapStruct implementations without installing Node or running tests.
bootstrap: sh ./mvnw -B -ntp -Pprod -DskipTests -Dskip.installnodenpm -Dskip.npm -Dspotless.skip=true compile

exclude:
  - name: All
    paths:
      - node_modules
      - node
      - target
      - coverage
